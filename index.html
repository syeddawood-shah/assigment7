
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Cards Assignment</title>

<!-- Font Awesome for logos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
}

.card {
    width: 260px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-align: center;
    padding: 30px 20px;
    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
}

.card i {
    font-size: 50px;
    margin-bottom: 15px;
}

/* Twitter Card */
.twitter i { color: #1DA1F2; }
.twitter h2 { color: #333; }

/* Instagram Card - Pink background */
.instagram {
    background: #E1306C;
    color: #fff;
    border: none;
}
.instagram i { color: #fff; }
.instagram h2 { color: #fff; }
.instagram p { color: #fff; }

/* Youtube Card */
.youtube i { color: #FF0000; }
.youtube h2 { color: #555; }

.card h2 {
    font-size: 22px;
    margin-bottom: 12px;
    letter-spacing: 1px;
}

.card p {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 20px;
    min-height: 80px;
}

.instagram p {
    color: #fff;
}

.btn {
    display: inline-block;
    padding: 10px 25px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
}

.twitter .btn, .youtube .btn {
    background: #222;
    color: #fff;
}
.twitter .btn:hover, .youtube .btn:hover {
    background: #000;
}

.instagram .btn {
    background: #fff;
    color: #E1306C;
}
.instagram .btn:hover {
    background: #f0f0f0;
}

/* Mobile responsive */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
        align-items: center;
    }
}
</style>
</head>
<body>

<div class="container">
    
    <!-- Twitter Card -->
    <div class="card twitter">
        <i class="fa-brands fa-twitter"></i>
        <h2>TWITTER</h2>
        <p>Connect with us on Twitter and stay updated with our latest news and updates.</p>
        <a href="#" class="btn">Follow</a>
    </div>

    <!-- Instagram Card -->
    <div class="card instagram">
        <i class="fa-brands fa-instagram"></i>
        <h2>INSTAGRAM</h2>
        <p>Follow us on Instagram for amazing photos, updates, and daily content.</p>
        <a href="#" class="btn">Follow</a>
    </div>

    <!-- Youtube Card -->
    <div class="card youtube">
        <i class="fa-brands fa-youtube"></i>
        <h2>YOUTUBE</h2>
        <p>Subscribe to our YouTube channel for videos, tutorials, and more.</p>
        <a href="#" class="btn">Subscribe</a>
    </div>

</div>

</body>
</html>
